name: CI

on:
  push:
    branches:
      - main  
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GOFLAGS: -mod=mod
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Test
        run: make test

      - name: Build
        run: make build

      - name: Package
        if: github.event_name == 'push'
        run: make package

      - name: Upload package
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: com.github.officeutils.dm-export
          path: dist/com.github.officeutils.dm-export-0.1.0.tar.gz
